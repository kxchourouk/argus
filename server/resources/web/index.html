<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e2e5ea;
    --text: #15181d; --muted: #5f6774; --faint: #8b93a1;
    --accent: #2f6fde; --cpu: #2f6fde; --ram: #8a4bd6;
    --ok: #1f9d55; --ok-bg: #e6f6ec; --warn: #b7791f; --warn-bg: #fdf3e1;
    --crit: #d33a3a; --crit-bg: #fde8e8; --off: #8b93a1; --off-bg: #eceef1;
    --grid: #e9ecf0; --shadow: 0 1px 2px rgba(16,24,40,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --border: #2a303a;
      --text: #e8ebf0; --muted: #a0a8b5; --faint: #6f7886;
      --accent: #5b93f0; --cpu: #5b93f0; --ram: #b18af0;
      --ok: #3fc27a; --ok-bg: #15301f; --warn: #e2a84a; --warn-bg: #352a14;
      --crit: #f06464; --crit-bg: #3a1a1a; --off: #6f7886; --off-bg: #232830;
      --grid: #232831; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --border: #2a303a;
    --text: #e8ebf0; --muted: #a0a8b5; --faint: #6f7886;
    --accent: #5b93f0; --cpu: #5b93f0; --ram: #b18af0;
    --ok: #3fc27a; --ok-bg: #15301f; --warn: #e2a84a; --warn-bg: #352a14;
    --crit: #f06464; --crit-bg: #3a1a1a; --off: #6f7886; --off-bg: #232830;
    --grid: #232831; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
           padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
  .pulse.bad { background: var(--crit); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  main { padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; }
  .banner { display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; background: var(--crit-bg); color: var(--crit); font-weight: 550; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 24px; font-weight: 650; margin-top: 2px; }
  .stat .value small { font-size: 14px; color: var(--faint); font-weight: 500; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); transition: border-color .2s; }
  .card.anom { border-color: var(--warn); }
  .card.down { opacity: .72; }
  .card.down canvas { filter: grayscale(1); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .vm-name { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  .vm-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pill { font-size: 11px; font-weight: 650; padding: 3px 8px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
  .s-ONLINE  { color: var(--ok);   background: var(--ok-bg); }
  .s-SUSPECT { color: var(--warn); background: var(--warn-bg); }
  .s-DOWN    { color: var(--crit); background: var(--crit-bg); }
  .s-STOPPED { color: var(--off);  background: var(--off-bg); }
  .meters { margin: 12px 0 8px; display: grid; gap: 7px; }
  .meter { display: grid; grid-template-columns: 40px 1fr 52px; align-items: center; gap: 8px; font-size: 12.5px; }
  .meter .bar { height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0; border-radius: 4px; transition: width .6s ease, background .3s; }
  .meter .v { text-align: right; }
  .chart-wrap { position: relative; }
  canvas { width: 100%; height: 120px; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin: 2px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; font-size: 11.5px; display: none; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .ai { border-radius: 8px; padding: 8px 10px; font-size: 12.5px; background: var(--surface-2); margin-top: 6px; }
  .ai b { font-weight: 650; }
  .ai.anomaly { background: var(--warn-bg); color: var(--warn); }
  .ai.forecast { background: var(--crit-bg); color: var(--crit); }
  .ai .prog { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .ai .prog div { height: 100%; background: var(--accent); }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .facts b { display: block; color: var(--text); font-size: 13px; font-weight: 600; }
  .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 28px; color: var(--muted); text-align: center; }
  .empty code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
  aside { position: sticky; top: 16px; display: grid; gap: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel-head h2 { margin: 0; }
  .alerts { max-height: 420px; overflow: auto; display: grid; gap: 6px; }
  .alert { border-left: 3px solid var(--off); padding: 6px 8px 6px 10px; background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 12.5px; }
  .alert.WARNING { border-color: var(--warn); }
  .alert.CRITICAL { border-color: var(--crit); }
  .alert.INFO { border-color: var(--accent); }
  .alert .meta { display: flex; gap: 6px; align-items: center; color: var(--faint); font-size: 11px; margin-bottom: 2px; }
  .chip { font-size: 10.5px; font-weight: 650; padding: 1px 6px; border-radius: 4px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .alert.WARNING .chip { color: var(--warn); }
  .alert.CRITICAL .chip { color: var(--crit); }
  button, select, input { font: inherit; color: var(--text); }
  button { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  button:hover { border-color: var(--faint); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { padding: 3px 8px; font-size: 12px; }
  button:disabled { opacity: .55; cursor: wait; }
  select, input { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; width: 100%; }
  .form { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hint { font-size: 11.5px; color: var(--faint); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .results { display: grid; gap: 8px; margin-top: 10px; }
  .result { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .result .rh { display: flex; justify-content: space-between; padding: 5px 9px; background: var(--surface-2); font-size: 12px; font-weight: 600; }
  .result .ok { color: var(--ok); } .result .ko { color: var(--crit); }
  .result pre { margin: 0; padding: 8px 9px; font-size: 11.5px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } aside { position: static; } }
  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <rect width="34" height="34" rx="9" fill="var(--accent)"/>
      <path d="M6 17c3-5.5 7-8 11-8s8 2.5 11 8c-3 5.5-7 8-11 8s-8-2.5-11-8z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="17" cy="17" r="4" fill="#fff"/>
    </svg>
    <div>
      <h1>Argus</h1>
      <p>Distributed VM monitoring · Java RMI · AI anomaly detection</p>
    </div>
  </div>
  <div class="live"><span class="pulse" id="pulse"></span><span id="liveText">Connecting…</span></div>
</header>

<main>
  <div class="banner" id="banner">Host server unreachable. Retrying…</div>

  <section class="stats">
    <div class="stat"><div class="label">VMs online</div><div class="value num" id="stOnline">–</div></div>
    <div class="stat"><div class="label">VMs down</div><div class="value num" id="stDown">–</div></div>
    <div class="stat"><div class="label">Anomalies right now</div><div class="value num" id="stAnom">–</div></div>
    <div class="stat"><div class="label">Alerts (last 10 min)</div><div class="value num" id="stAlerts">–</div></div>
  </section>

  <div class="layout">
    <section>
      <h2>Virtual machines</h2>
      <div class="cards" id="cards"></div>
    </section>

    <aside>
      <div class="panel">
        <div class="panel-head"><h2>Remote commands</h2></div>
        <div class="form">
          <div class="row">
            <label><span class="hint">Target</span><select id="target"></select></label>
            <label><span class="hint">Action</span><select id="action"></select></label>
          </div>
          <label><span class="hint" id="argHint">Argument</span><input id="arg" class="mono" autocomplete="off"></label>
          <button class="primary" id="run">Run command</button>
          <div class="hint">Demo shortcuts (on the selected target):</div>
          <div class="quick">
            <button class="small" data-q="stress-cpu|45">Stress CPU 45 s</button>
            <button class="small" data-q="leak-memory|400">Simulate memory leak</button>
            <button class="small" data-q="stop-load|">Stop load</button>
            <button class="small" data-q="top|">Top processes</button>
          </div>
        </div>
        <div class="results" id="results"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Alerts</h2><button class="small" id="clear">Clear</button></div>
        <div class="alerts" id="alerts"><div class="hint">No alerts yet.</div></div>
      </div>
    </aside>
  </div>
</main>

<script>
const ACTIONS = {
  "sysinfo":        { arg: null,  label: "System info" },
  "uptime":         { arg: null,  label: "Uptime & load" },
  "top":            { arg: null,  label: "Top processes" },
  "disk":           { arg: null,  label: "Disk usage" },
  "network":        { arg: null,  label: "Network interfaces" },
  "kill":           { arg: "PID of the process to stop", label: "Kill process" },
  "stress-cpu":     { arg: "Duration in seconds (default 30)", label: "Stress CPU (demo)" },
  "leak-memory":    { arg: "Target MB (default 300)", label: "Simulate memory leak (demo)" },
  "release-memory": { arg: null,  label: "Release leaked memory" },
  "stop-load":      { arg: null,  label: "Stop all demo load" },
  "shell":          { arg: "Shell command (agent needs --allow-shell)", label: "Shell command" }
};
const $ = id => document.getElementById(id);
const cards = new Map();
let lastState = null;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fmtTime(ms) { return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function fmtDur(s) {
  if (s < 0) return "–";
  if (s < 90) return Math.round(s) + " s";
  if (s < 5400) return (s / 60).toFixed(1) + " min";
  if (s < 172800) return (s / 3600).toFixed(1) + " h";
  return (s / 86400).toFixed(1) + " d";
}
function level(p) { return p >= 90 ? css("--crit") : p >= 75 ? css("--warn") : css("--ok"); }

// ---------------------------------------------------------------- controls
for (const [k, a] of Object.entries(ACTIONS)) $("action").add(new Option(a.label, k));
function syncArg() {
  const a = ACTIONS[$("action").value];
  $("arg").disabled = !a.arg;
  $("arg").placeholder = a.arg || "No argument";
  $("argHint").textContent = a.arg ? "Argument" : "Argument (none)";
}
$("action").onchange = syncArg; syncArg();

function syncTargets(vms) {
  const sel = $("target"), cur = sel.value || "*";
  const wanted = ["*", ...vms.map(v => v.name)];
  const have = [...sel.options].map(o => o.value);
  if (wanted.join("|") === have.join("|")) return;
  sel.innerHTML = "";
  sel.add(new Option("All VMs (parallel)", "*"));
  vms.forEach(v => sel.add(new Option(v.name, v.name)));
  sel.value = wanted.includes(cur) ? cur : "*";
}

async function runCommand(action, arg) {
  const btns = document.querySelectorAll("aside button");
  btns.forEach(b => b.disabled = true);
  $("results").innerHTML = '<div class="hint">Running on ' + esc($("target").selectedOptions[0]?.text || "") + '…</div>';
  try {
    const body = new URLSearchParams({ target: $("target").value || "*", action, arg: arg || "" });
    const r = await fetch("/api/command", { method: "POST", body });
    const data = await r.json();
    $("results").innerHTML = data.results.map(x => `
      <div class="result">
        <div class="rh"><span>${esc(x.vm)}</span><span class="${x.success ? "ok" : "ko"}">${x.success ? "✓ success" : "✗ failed"} · ${x.ms} ms</span></div>
        <pre class="mono">${esc(x.output || "(no output)")}</pre>
      </div>`).join("");
  } catch (e) {
    $("results").innerHTML = '<div class="hint">Request failed: ' + esc(e.message) + "</div>";
  } finally {
    btns.forEach(b => b.disabled = false);
    poll();
  }
}
$("run").onclick = () => runCommand($("action").value, $("arg").value);
document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
  const [a, g] = b.dataset.q.split("|");
  runCommand(a, g);
});
$("clear").onclick = async () => { await fetch("/api/alerts/clear", { method: "POST" }); poll(); };

// ---------------------------------------------------------------- VM cards
function makeCard(name) {
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `
    <div class="card-head">
      <div>
        <div class="vm-name"><span class="dot"></span><span class="nm"></span></div>
        <div class="vm-sub"></div>
      </div>
      <span class="pill"></span>
    </div>
    <div class="meters">
      ${["CPU", "RAM", "Disk"].map(k => `<div class="meter" data-k="${k}"><span>${k}</span><div class="bar"><div class="fill"></div></div><span class="v num">–</span></div>`).join("")}
    </div>
    <div class="legend"><span><i style="background:var(--cpu)"></i>CPU</span><span><i style="background:var(--ram)"></i>RAM</span><span><i style="background:var(--warn)"></i>AI anomaly</span><span style="margin-left:auto">last 5 min</span></div>
    <div class="chart-wrap"><canvas></canvas><div class="tip num"></div></div>
    <div class="ai ai-main"></div>
    <div class="ai ai-fc"></div>
    <div class="facts">
      <div>Processes<b class="num f-procs">–</b></div>
      <div>Load<b class="num f-load">–</b></div>
      <div>Network<b class="num f-net">–</b></div>
      <div>Uptime<b class="num f-up">–</b></div>
    </div>`;
  el.querySelector(".nm").textContent = name;
  const canvas = el.querySelector("canvas"), tip = el.querySelector(".tip");
  canvas.addEventListener("mousemove", e => hover(el, e));
  canvas.addEventListener("mouseleave", () => { tip.style.display = "none"; el._hover = null; draw(el); });
  $("cards").appendChild(el);
  return el;
}

function updateCard(el, vm) {
  const down = vm.status === "DOWN" || vm.status === "STOPPED";
  const anomalous = !down && vm.ai && vm.ai.anomalous;
  el.classList.toggle("down", down);
  el.classList.toggle("anom", !!anomalous);
  el.querySelector(".dot").style.background =
    { ONLINE: css("--ok"), SUSPECT: css("--warn"), DOWN: css("--crit"), STOPPED: css("--off") }[vm.status];
  el.querySelector(".vm-sub").textContent = `${vm.address} · ${vm.os} · ${vm.cores} cores`;
  const pill = el.querySelector(".pill");
  pill.className = "pill s-" + vm.status;
  pill.textContent = vm.status === "SUSPECT" ? "NO HEARTBEAT" : vm.status;

  const l = vm.latest || {};
  const vals = { CPU: l.cpu, RAM: l.ram, Disk: l.disk };
  el.querySelectorAll(".meter").forEach(m => {
    const v = vals[m.dataset.k];
    const fill = m.querySelector(".fill");
    fill.style.width = (v ?? 0) + "%";
    fill.style.background = down ? css("--off") : level(v ?? 0);
    m.querySelector(".v").textContent = v == null ? "–" : v.toFixed(1) + "%";
  });
  if (vm.latest) {
    el.querySelector(".f-procs").textContent = l.procs;
    el.querySelector(".f-load").textContent = l.load >= 0 ? l.load.toFixed(2) : "n/a";
    el.querySelector(".f-net").textContent = ((l.rx + l.tx) || 0).toFixed(1) + " KB/s";
    el.querySelector(".f-up").textContent = fmtDur(l.uptime);
  }

  // AI status
  const ai = el.querySelector(".ai-main");
  ai.className = "ai ai-main";
  if (down) {
    const since = vm.status === "DOWN" ? "Unreachable" : "Agent stopped";
    ai.innerHTML = `<b>${since}</b> · last heartbeat ${fmtTime(vm.lastSeen)} (${fmtDur((lastState.now - vm.lastSeen) / 1000)} ago)`;
  } else if (!vm.ai) {
    ai.innerHTML = "Waiting for the first metrics…";
  } else if (vm.ai.warmingUp) {
    const p = Math.round(100 * vm.ai.training / vm.ai.warmup);
    ai.innerHTML = `<b>AI learning normal behaviour</b> · ${vm.ai.training}/${vm.ai.warmup} samples<div class="prog"><div style="width:${p}%"></div></div>`;
  } else if (vm.ai.anomalous) {
    ai.classList.add("anomaly");
    ai.innerHTML = `<b>⚠ Anomaly detected</b> · ${esc(vm.ai.reason)}`;
  } else {
    ai.innerHTML = `<b>AI: normal behaviour</b> · isolation score ${vm.ai.score.toFixed(2)} (threshold ${vm.ai.threshold.toFixed(2)}) · model trained on ${vm.ai.training} samples · ${vm.anomalyCount} anomalies so far`;
  }

  // forecast
  const fc = el.querySelector(".ai-fc");
  fc.className = "ai ai-fc";
  const f = vm.forecast;
  if (down || !f) {
    fc.style.display = down ? "none" : "";
    fc.innerHTML = down ? "" : "RAM forecast: collecting 40 s of history…";
  } else {
    fc.style.display = "";
    const sign = f.slopePerMin >= 0 ? "+" : "";
    if (f.etaTo90 > 0 && f.etaTo90 <= 600) {
      fc.classList.add("forecast");
      fc.innerHTML = `<b>RAM forecast: 90% in ~${fmtDur(f.etaTo90)}</b> · trend ${sign}${f.slopePerMin.toFixed(1)}%/min (R² ${f.r2.toFixed(2)})`;
    } else {
      fc.innerHTML = `RAM forecast in 5 min: <b class="num">${f.in5min.toFixed(1)}%</b> · trend ${sign}${f.slopePerMin.toFixed(2)}%/min`;
    }
  }
  el._vm = vm;
  draw(el);
}

// ---------------------------------------------------------------- chart (canvas, no library)
function draw(el) {
  const vm = el._vm, canvas = el.querySelector("canvas");
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const pad = { l: 36, r: 6, t: 6, b: 16 };
  const W = w - pad.l - pad.r, H = h - pad.t - pad.b;
  const now = lastState ? lastState.now : Date.now(), span = 300000;
  const X = t => pad.l + W * (1 - (now - t) / span);
  const Y = v => pad.t + H * (1 - v / 100);

  g.font = "10px system-ui"; g.fillStyle = css("--faint"); g.strokeStyle = css("--grid"); g.lineWidth = 1;
  [0, 50, 100].forEach(v => {
    g.beginPath(); g.moveTo(pad.l, Y(v) + .5); g.lineTo(w - pad.r, Y(v) + .5); g.stroke();
    g.textAlign = "right"; g.fillText(v + "%", pad.l - 4, Y(v) + 3);
  });
  g.textAlign = "left"; g.fillText("-5 min", pad.l, h - 3);
  g.textAlign = "right"; g.fillText("now", w - pad.r, h - 3);
  if (!vm || !vm.history || !vm.history.t.length) return;
  const H_ = vm.history;

  // anomaly bands
  g.fillStyle = css("--warn"); g.globalAlpha = .18;
  H_.t.forEach((t, i) => { if (H_.anom[i]) g.fillRect(X(t) - 2, pad.t, 4, H); });
  g.globalAlpha = 1;

  const line = (arr, color) => {
    g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
    let started = false;
    H_.t.forEach((t, i) => {
      const x = X(t), y = Y(arr[i]);
      if (x < pad.l) return;
      if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y);
    });
    g.stroke();
  };
  line(H_.ram, css("--ram"));
  line(H_.cpu, css("--cpu"));

  // anomaly markers on top
  g.fillStyle = css("--warn");
  H_.t.forEach((t, i) => { if (H_.anom[i]) { g.beginPath(); g.arc(X(t), pad.t + 3, 2.5, 0, 7); g.fill(); } });

  if (el._hover != null) {
    const i = el._hover, x = X(H_.t[i]);
    g.strokeStyle = css("--faint"); g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(x + .5, pad.t); g.lineTo(x + .5, pad.t + H); g.stroke(); g.setLineDash([]);
    [[H_.cpu[i], css("--cpu")], [H_.ram[i], css("--ram")]].forEach(([v, c]) => {
      g.fillStyle = c; g.beginPath(); g.arc(x, Y(v), 3.5, 0, 7); g.fill();
    });
  }
}

function hover(el, e) {
  const vm = el._vm; if (!vm || !vm.history || !vm.history.t.length) return;
  const canvas = el.querySelector("canvas"), rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, w = rect.width, pad = 36, W = w - pad - 6;
  const t = lastState.now - 300000 * (1 - (mx - pad) / W);
  let best = 0;
  vm.history.t.forEach((ti, i) => { if (Math.abs(ti - t) < Math.abs(vm.history.t[best] - t)) best = i; });
  el._hover = best;
  const H_ = vm.history, tip = el.querySelector(".tip");
  tip.innerHTML = `${fmtTime(H_.t[best])} · CPU ${H_.cpu[best].toFixed(1)}% · RAM ${H_.ram[best].toFixed(1)}%` +
    (H_.anom[best] ? ` · <span style="color:var(--warn)">anomaly (${H_.score[best].toFixed(2)})</span>` : "");
  tip.style.display = "block";
  tip.style.left = Math.min(Math.max(mx - tip.offsetWidth / 2, 0), w - tip.offsetWidth) + "px";
  tip.style.top = "-26px";
  draw(el);
}

// ---------------------------------------------------------------- alerts
let lastAlertKey = "";
function renderAlerts(alerts) {
  const key = alerts.map(a => a.id).join(",");
  if (key === lastAlertKey) return;
  lastAlertKey = key;
  $("alerts").innerHTML = alerts.length ? alerts.map(a => `
    <div class="alert ${a.level}">
      <div class="meta"><span class="num">${fmtTime(a.time)}</span><span class="chip">${esc(a.type)}</span><span>${esc(a.vm)}</span></div>
      ${esc(a.message)}
    </div>`).join("") : '<div class="hint">No alerts yet.</div>';
}

// ---------------------------------------------------------------- polling
async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const s = await r.json();
    lastState = s;
    $("banner").style.display = "none";
    $("pulse").classList.remove("bad");
    $("liveText").textContent = `Live · ${fmtTime(s.now)} · server up ${fmtDur(s.uptime)}`;
    $("stOnline").innerHTML = `${s.stats.online}<small> / ${s.stats.total}</small>`;
    $("stDown").textContent = s.stats.down;
    $("stDown").style.color = s.stats.down ? css("--crit") : "";
    $("stAnom").textContent = s.stats.anomalous;
    $("stAnom").style.color = s.stats.anomalous ? css("--warn") : "";
    $("stAlerts").textContent = s.stats.alerts10min;

    if (!s.vms.length) {
      $("cards").innerHTML = `<div class="empty">No VM registered yet.<br><br>On each VM run:<br><br>
        <code class="mono">java -jar argus-agent.jar --server &lt;host-ip&gt; --name vm1</code></div>`;
      cards.clear();
    } else {
      const empty = $("cards").querySelector(".empty"); if (empty) empty.remove();
      s.vms.forEach(vm => {
        if (!cards.has(vm.name)) cards.set(vm.name, makeCard(vm.name));
        updateCard(cards.get(vm.name), vm);
      });
    }
    syncTargets(s.vms);
    renderAlerts(s.alerts);
  } catch (e) {
    $("banner").style.display = "block";
    $("pulse").classList.add("bad");
    $("liveText").textContent = "Disconnected";
  }
}
poll();
setInterval(poll, 2000);
window.addEventListener("resize", () => cards.forEach(draw));
</script>
</body>
</html>
